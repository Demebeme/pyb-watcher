name: watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests edge-tts
      - run: python watcher.py
        env:
          ROBLOX_KEY: ${{ secrets.ROBLOX_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
